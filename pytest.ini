[pytest]
# Test configuration for the Kafka 3.9.2 + ZooKeeper 3.9.5 Compose lab.
#
#   pytest                      unit tests only (fast, no Docker)
#   pytest -m slow              include certificate generation (openssl, ~30s)
#   pytest -m integration       end-to-end cluster tests (requires Docker)
#
# The default -m filter excludes integration tests; an explicit -m on the
# command line replaces it.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not integration"
markers =
    slow: needs openssl and takes tens of seconds (certificate generation)
    integration: needs a working Docker daemon; builds images and starts a cluster
    ssl: exercises the SSL/TLS listeners

        ZOOKEEPER_VERSION: ${ZOOKEEPER_VERSION:-3.9.5}
    hostname: zookeeper1
    networks: [kafka-net]
    restart: unless-stopped
    environment:
      ZOO_MY_ID: "1"
      ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181|server.2=zookeeper2:2888:3888;2181|server.3=zookeeper3:2888:3888;2181"
      ZOO_CLIENT_PORT: "2181"

# SSL client config — for running Kafka CLI tools from the HOST against a host
# SSL port (e.g. localhost:19093).
#
# This is a TEMPLATE. `make certs` (generate mode) regenerates this file with
# the password from your .env. The truststore path is relative to the repo root,
# so run host-side CLI tools from the repository root directory.
#
# NOTE: host-side SSL access requires the broker SAN to cover 'localhost'
#       (it does) and the password below to match KAFKA_SSL_PASSWORD.
security.protocol=SSL
ssl.truststore.type=PKCS12
ssl.truststore.location=certs/generated/client/kafka.client.truststore.p12
ssl.truststore.password=changeit
ssl.endpoint.identification.algorithm=https

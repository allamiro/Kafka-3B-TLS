# SSL client config — for running Kafka CLI tools from the HOST against a host
# SSL port (e.g. localhost:19093).
#
# This is a TEMPLATE. `make certs` (generate mode) regenerates this file. The
# trust material path is relative to the repo root, so run host-side CLI tools
# from the repository root directory.
#
# Trust material is PEM rather than PKCS12: a PKCS12 file produced by
# `openssl -nokeys` is not a valid Java truststore. Kafka reads PEM directly
# (KIP-651), so no truststore password is needed.
#
# NOTE: host-side SSL access requires the broker SAN to cover 'localhost'
#       (it does).
security.protocol=SSL
ssl.truststore.type=PEM
ssl.truststore.location=certs/generated/client/ca-chain.crt
ssl.endpoint.identification.algorithm=https

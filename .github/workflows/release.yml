name: Release

# Tag a release to publish images and an offline lab bundle:
#
#     git tag -a v1.0.0 -m "Kafka 3.9.2 + ZooKeeper 3.9.5 lab"
#     git push origin v1.0.0
#
# Pre-release tags (v1.0.0-rc1) are published as GitHub pre-releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - id: meta
        name: Derive the version
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r tests/requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Validate every shipped Compose file
        run: |
          for f in docker-compose.yml docker-compose.ssl.yml docker-compose.plaintext.yml; do
            docker compose -f "$f" config -q
          done

  images:
    name: Publish container images
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: kafka, dockerfile: images/kafka/Dockerfile}
          - {component: zookeeper, dockerfile: images/zookeeper/Dockerfile}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,scope=release-${{ matrix.component }},mode=max

  bundle:
    name: Publish the release bundle
    runs-on: ubuntu-latest
    needs: [verify, images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Assemble the offline lab bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          name="kafka-zookeeper-lab-${VERSION}"
          mkdir -p "dist/${name}"
          # Everything needed to run the lab; no history, no upstream tarballs,
          # no certificates.
          cp -r \
            README.md SECURITY.md Makefile .env.example \
            docker-compose.yml docker-compose.ssl.yml docker-compose.plaintext.yml \
            scripts images certs config docs \
            "dist/${name}/"
          find "dist/${name}/certs/generated" -mindepth 1 ! -name '.gitkeep' -delete
          mkdir -p "dist/${name}/vendor"
          cp vendor/README.md "dist/${name}/vendor/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            echo "Apache Kafka **3.9.2** (ZooKeeper mode) + Apache ZooKeeper **3.9.5**."
            echo
            echo "### Container images"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}/kafka:${VERSION#v}"
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}/zookeeper:${VERSION#v}"
            echo '```'
            echo
            echo "### Offline bundle"
            echo
            echo "\`kafka-zookeeper-lab-${VERSION}.tar.gz\` contains the Compose files,"
            echo "image definitions, certificate tooling, scripts and documentation."
            echo "Verify it with the accompanying \`.sha256\` file. Air-gapped builds"
            echo "additionally need the upstream tarballs in \`vendor/\` — see"
            echo "\`docs/airgapped-build.md\`."
          } > "$notes"

          args=(--title "${VERSION}" --notes-file "$notes" --generate-notes)
          if [ "${PRERELEASE}" = "true" ]; then args+=(--prerelease); fi
          gh release create "${VERSION}" "${args[@]}" \
            "dist/kafka-zookeeper-lab-${VERSION}.tar.gz" \
            "dist/kafka-zookeeper-lab-${VERSION}.tar.gz.sha256"

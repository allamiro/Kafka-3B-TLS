name: Security

on:
  push:
    branches: [master, kafka-distributed]
  pull_request:
  schedule:
    # Weekly, so newly disclosed CVEs in the base images surface without a push.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (working tree and history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose --no-banner

      - name: Reject tracked key or certificate material
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(key|crt|csr|pem|p12|jks|keystore|truststore|srl)$'; then
            echo "::error::private key or certificate material is tracked in git"
            exit 1
          fi
          if git ls-files | grep -qx '.env'; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          echo "No key material tracked."

  filesystem:
    name: Filesystem and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy (vulnerabilities, secrets, misconfiguration)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs packages,vendor,.git \
            --no-progress .

  images:
    name: Image scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: kafka, dockerfile: images/kafka/Dockerfile}
          - {component: zookeeper, dockerfile: images/zookeeper/Dockerfile}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: kafka-lab/${{ matrix.component }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Trivy image scan (SARIF)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            aquasec/trivy:latest image \
            --format sarif --output "/out/trivy-${{ matrix.component }}.sarif" \
            --severity MEDIUM,HIGH,CRITICAL \
            --no-progress "kafka-lab/${{ matrix.component }}:scan"

      - name: Upload SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      # Base-image CVEs are inherited from eclipse-temurin and are reported,
      # not gated. Anything introduced by this repository is caught above.
      - name: Summarise findings
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --no-progress \
            "kafka-lab/${{ matrix.component }}:scan" | tee -a "$GITHUB_STEP_SUMMARY"

  configuration:
    name: Lab security defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the shipped defaults stay safe
        run: |
          set -euo pipefail
          fail=0

          # Hostname verification must never be silently disabled.
          grep -q 'ssl.endpoint.identification.algorithm=https' \
            images/kafka/templates/server-ssl.properties.tpl || {
            echo "::error::hostname verification is not enabled in the SSL template"; fail=1; }

          # Only TLS 1.2/1.3 may be offered.
          if grep -E 'SSL_ENABLED_PROTOCOLS=.*(SSLv|TLSv1\.0|TLSv1\.1)' .env.example; then
            echo "::error::obsolete TLS versions enabled in .env.example"; fail=1
          fi

          # Containers must not run as root.
          for dockerfile in images/*/Dockerfile; do
            grep -q '^USER ' "$dockerfile" || {
              echo "::error file=$dockerfile::image does not drop root"; fail=1; }
          done

          # Certificate mounts stay read-only.
          if grep -n '/etc/kafka/secrets' docker-compose*.yml | grep -v ':ro'; then
            echo "::error::a certificate mount is not read-only"; fail=1
          fi

          exit "$fail"
